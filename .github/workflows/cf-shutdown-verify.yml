name: Verify Cloudflare shutdown
on:
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify active service configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import os,json,urllib.request,urllib.error,uuid,sys,time
          from urllib.parse import quote
          token=os.environ["CF_TOKEN"]; account=os.environ["CF_ACCOUNT"]
          base="https://api.cloudflare.com/client/v4/accounts/"+account+"/"
          failures=[]
          def api(path,method="GET",data=None,content_type=None):
              headers={"Authorization":"Bearer "+token}
              if data is not None:
                  if not isinstance(data,bytes):data=json.dumps(data).encode()
                  headers["Content-Type"]=content_type or "application/json"
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,data=data,headers=headers,method=method),timeout=60) as r:d=json.load(r)
              except urllib.error.HTTPError as e:
                  try:err=json.load(e);info=[{"code":x.get("code"),"message":x.get("message")} for x in err.get("errors",[])]
                  except Exception:info=[]
                  raise RuntimeError(method+" "+path+": HTTP "+str(e.code)+" "+json.dumps(info))
              if not d.get("success"):raise RuntimeError(method+" "+path+": API unsuccessful")
              return d.get("result")
          def multipart(parts):
              boundary="offline-"+uuid.uuid4().hex
              out=[]
              for name,filename,ctype,value in parts:
                  out.append(("--"+boundary+"\r\nContent-Disposition: form-data; name=\""+name+"\""+("; filename=\""+filename+"\"" if filename else "")+"\r\nContent-Type: "+ctype+"\r\n\r\n").encode()+value.encode()+b"\r\n")
              return b"".join(out)+("--"+boundary+"--\r\n").encode(),"multipart/form-data; boundary="+boundary
          
          names=["2fa","bitwadren","cloudflare_temp_email","idky-api","idky-dashboard","may-account","myhealthy","paper","wz-roast"]
          for name in names:
              path="workers/scripts/"+name
              sub=api(path+"/subdomain")
              settings=api(path+"/settings")
              dep=api(path+"/deployments")
              request=urllib.request.Request(base+path+"/content",headers={"Authorization":"Bearer "+token})
              try:
                  with urllib.request.urlopen(request,timeout=30) as r:content=r.read()
                  marker=b"Service offline" in content
              except urllib.error.HTTPError as e:
                  marker=None
              print("VERIFY_WORKER",json.dumps({"name":name,"enabled":sub.get("enabled"),"previews_enabled":sub.get("previews_enabled"),"offline_code_marker":marker,"binding_types":sorted({b["type"] for b in settings.get("bindings",[])}),"active_versions":(dep.get("deployments") or [{}])[0].get("versions",[])}),flush=True)
              if sub.get("enabled") or sub.get("previews_enabled") or marker is False:failures.append(name)
          for name in ["may-account","temp-email-pages","cloudflare-imgbed"]:
              project=api("pages/projects/"+name)
              dep=project.get("canonical_deployment") or {}
              config=(project.get("source") or {}).get("config") or {}
              print("VERIFY_PAGE",json.dumps({"name":name,"active_deployment_id":dep.get("id"),"environment":dep.get("environment"),"latest_stage":dep.get("latest_stage"),"domains":project.get("domains"),"automatic_deployments":config.get("deployments_enabled")}),flush=True)
              for host in project.get("domains",[]):
                  url="https://"+host+"/"
                  try:
                      with urllib.request.urlopen(url,timeout=15) as response:status=response.status
                  except urllib.error.HTTPError as e:status=e.code
                  except Exception as e:status=type(e).__name__
                  print("VERIFY_PUBLIC",json.dumps({"host":host,"status":status}),flush=True)
          print("VERIFY_SUMMARY",json.dumps({"failures":failures}),flush=True)
          if failures:sys.exit(1)
