name: Stop Cloudflare Pages production
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: cloudflare-service-shutdown
  cancel-in-progress: false
jobs:
  shutdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish 503 shutdown version without removing data
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import os,json,urllib.request,urllib.error,uuid,sys,time
          from urllib.parse import quote
          token=os.environ["CF_TOKEN"]; account=os.environ["CF_ACCOUNT"]
          base="https://api.cloudflare.com/client/v4/accounts/"+account+"/"
          failures=[]
          def api(path,method="GET",data=None,content_type=None):
              headers={"Authorization":"Bearer "+token}
              if data is not None:
                  if not isinstance(data,bytes):data=json.dumps(data).encode()
                  headers["Content-Type"]=content_type or "application/json"
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,data=data,headers=headers,method=method),timeout=60) as r:d=json.load(r)
              except urllib.error.HTTPError as e:
                  try:err=json.load(e);info=[{"code":x.get("code"),"message":x.get("message")} for x in err.get("errors",[])]
                  except Exception:info=[]
                  raise RuntimeError(method+" "+path+": HTTP "+str(e.code)+" "+json.dumps(info))
              if not d.get("success"):raise RuntimeError(method+" "+path+": API unsuccessful")
              return d.get("result")
          def multipart(parts):
              boundary="offline-"+uuid.uuid4().hex
              out=[]
              for name,filename,ctype,value in parts:
                  out.append(("--"+boundary+"\r\nContent-Disposition: form-data; name=\""+name+"\""+("; filename=\""+filename+"\"" if filename else "")+"\r\nContent-Type: "+ctype+"\r\n\r\n").encode()+value.encode()+b"\r\n")
              return b"".join(out)+("--"+boundary+"--\r\n").encode(),"multipart/form-data; boundary="+boundary
          
          offline='export default {fetch(){return new Response("Service offline",{status:503,headers:{"Content-Type":"text/plain; charset=utf-8","Cache-Control":"no-store"}})}};'
          for name in ["may-account","temp-email-pages","cloudflare-imgbed"]:
              try:
                  path="pages/projects/"+name
                  project=api(path)
                  print("RECOVERY_PAGE",json.dumps({"name":name,"canonical_deployment_id":(project.get("canonical_deployment") or {}).get("id"),"source_config":(project.get("source") or {}).get("config")}),flush=True)
                  source=project.get("source")
                  if source and source.get("type") in ["github","gitlab"]:
                      config=dict(source.get("config") or {})
                      config.update({"deployments_enabled":False,"production_deployments_enabled":False,"preview_deployment_setting":"none"})
                      api(path,"PATCH",{"source":{"type":source["type"],"config":config}})
                      print("AUTOMATIC_DEPLOYS_DISABLED",name,flush=True)
                  parts=[("branch",None,"text/plain",project["production_branch"]),("manifest",None,"application/json","{}"),("_worker.js","_worker.js","application/javascript+module",offline),("_routes.json","_routes.json","application/json",json.dumps({"version":1,"include":["/*"],"exclude":[]})),("commit_message",None,"text/plain","Owner requested shutdown: production responds 503")]
                  data,ctype=multipart(parts)
                  deployed=api(path+"/deployments","POST",data,ctype)
                  did=deployed["id"]
                  for i in range(30):
                      state=api(path+"/deployments/"+did)
                      stage=state.get("latest_stage") or {}
                      if stage.get("status")=="success":break
                      if stage.get("status") in ["failure","canceled"]:raise RuntimeError("Deployment failed")
                      time.sleep(3)
                  else:raise RuntimeError("Deployment did not reach success in verification window")
                  after=api(path)
                  active=(after.get("canonical_deployment") or {}).get("id")
                  if active!=did:raise RuntimeError("New offline deployment is not canonical")
                  print("PAGE_PRODUCTION_OFFLINE",json.dumps({"name":name,"deployment_id":did,"url":state.get("url"),"environment":state.get("environment"),"domains":after.get("domains")}),flush=True)
              except Exception as e:
                  failures.append(name);print("ERROR",name,str(e),flush=True)
          print("PAGES_OFFLINE_SUMMARY",json.dumps({"failures":failures}),flush=True)
          if failures:sys.exit(1)
