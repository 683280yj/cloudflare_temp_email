name: Restore previously paused services
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: cloudflare-service-restore
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Restore pre-shutdown versions and deployments
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import os,json,urllib.request,urllib.error,sys
          token=os.environ["CF_TOKEN"];account=os.environ["CF_ACCOUNT"];base="https://api.cloudflare.com/client/v4/accounts/"+account+"/"
          def api(path,method="GET",data=None):
           h={"Authorization":"Bearer "+token}
           if data is not None:h["Content-Type"]="application/json";data=json.dumps(data).encode()
           try:
            with urllib.request.urlopen(urllib.request.Request(base+path,data=data,headers=h,method=method),timeout=60) as r:d=json.load(r)
           except urllib.error.HTTPError as e:raise RuntimeError(method+" "+path+" HTTP "+str(e.code))
           if not d.get("success"):raise RuntimeError(method+" "+path+" unsuccessful")
           return d.get("result")
          versions={
          "2fa":"60f6cf93-0332-4289-9368-eacf9fe40f6e",
          "bitwadren":"8877f819-8593-4c26-87fb-d517dd7db21b",
          "cloudflare_temp_email":"fbbd0f03-9112-4cc9-b5b5-3d85e966e3b3",
          "idky-api":"00bc0d1c-6d13-4480-82c4-19b1aef3a403",
          "idky-dashboard":"96dfaeb4-2aac-4fe6-bd4e-ab26ee69c85a",
          "may-account":"78806f19-b9b5-49be-a364-61bf4710baca",
          "myhealthy":"096a9ced-59b3-4d3f-8249-7289652c74b3",
          "paper":"478fd9a7-309f-4f2a-a5ba-5e1f3da991e8",
          "wz-roast":"b3c184f1-9f9f-4589-bdf5-eff65749d924"}
          pages={"may-account":"78d068cf-318b-4c94-8657-c4a753b8d28f","temp-email-pages":"62f17b6d-a97d-45d2-bfb9-bdea40491014","cloudflare-imgbed":"6c8ea3fb-09da-45fa-9915-218592223c0c"}
          for n,v in versions.items():
           r=api("workers/scripts/"+n+"/deployments","POST",{"strategy":"percentage","versions":[{"version_id":v,"percentage":100}]})
           api("workers/scripts/"+n+"/subdomain","POST",{"enabled":True,"previews_enabled":False})
           print("WORKER_RESTORED",json.dumps({"name":n,"deployment":r.get("id"),"version":v}),flush=True)
          for n,d in pages.items():
           r=api("pages/projects/"+n+"/deployments/"+d+"/rollback","POST")
           print("PAGE_RESTORED",json.dumps({"name":n,"rollback":r}),flush=True)
          print("RESTORE_DONE",flush=True)
          
