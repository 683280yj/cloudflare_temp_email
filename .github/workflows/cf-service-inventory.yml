name: Cloudflare service inventory
on:
  workflow_dispatch:
permissions: {}
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: List Cloudflare Workers and Pages without revealing credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.error, sys
          token = os.environ.get("CF_TOKEN", "")
          account = os.environ.get("CF_ACCOUNT", "")
          if not token or not account:
              print("CLOUDFLARE_CREDENTIALS_NOT_CONFIGURED")
              sys.exit(1)
          for label, path in [("Workers", "workers/scripts"), ("Pages", "pages/projects")]:
              url = "https://api.cloudflare.com/client/v4/accounts/" + account + "/" + path
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.load(response)
                  if not data.get("success"):
                      print(label + ": API returned success=false")
                      sys.exit(1)
                  entries = data.get("result", [])
                  print(label + ": " + json.dumps([{"name": x.get("id") if label == "Workers" else x.get("name"), "subdomain": x.get("subdomain") if label == "Pages" else None} for x in entries]))
              except urllib.error.HTTPError as error:
                  print(label + ": HTTP " + str(error.code))
                  sys.exit(1)
